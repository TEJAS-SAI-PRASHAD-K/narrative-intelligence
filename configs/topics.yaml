# The case under study: seed keywords and boolean queries.
#
# Everything topic-specific lives here, not in code. Swapping the case (to a
# different election, outbreak, or conflict) must require editing this file and
# re-running `make data`, and nothing else. Phase 2 reads the same file so that
# narrative clusters can be traced back to the query that surfaced them.

# Human-readable description of what this corpus is *about*. Quoted verbatim in
# the EDA notebook's coverage statement, so keep it honest and specific.
case: >
  Indian misinformation narratives, English and Hindi, 2025-2026. Four domains
  that Indian fact-checking organisations debunk daily and that are documented
  in the academic literature on Indian information disorder: communal and
  religious claims, electoral-process claims, health claims, and financial
  scams and synthetic media.

  Chosen over the previous US health/election case for two reasons. First,
  India is the stated subject of this project and a US corpus could not support
  that claim. Second, India has an unusually dense public fact-checking
  ecosystem (IFCN-signatory organisations publishing structured verdicts in
  English and Hindi under open RSS), which is the only accessible source of
  *labelled* misinformation at the scale this project needs. The corpus and its
  labels can therefore come from the same country and the same window.

  What this case is NOT: a sample of Indian public opinion, or a measurement of
  how much misinformation exists in India. See the README's coverage statement.

topics:
  - id: communal_claims
    label: Communal and inter-religious claims
    # Recontextualised media is the dominant form here: an old or unrelated
    # video relabelled as a fresh incident. The claim is rarely a sentence that
    # can be checked -- it is a caption attached to real footage -- which is why
    # `misinfo_prob` alone will underperform on this topic and the Phase 2
    # cluster/stance path matters more. Said here so the result is expected
    # rather than discovered.
    keywords:
      - communal
      - communal tension
      - religious violence
      - temple
      - mosque
      - procession
      - old video
      - unrelated video
      - "फर्जी दावा"
      - "सांप्रदायिक"
      - "पुराना वीडियो"
      - "भ्रामक वीडियो"
    # GDELT DOC 2.0: a LIST OF EXACT PHRASES, OR-joined by the client into
    # ("a" OR "b"). Verified against the live API by the Phase 1 author: a
    # hand-written boolean string is quoted as a single phrase and rejected
    # with "phrase search that was too short or too long". Two-to-five word
    # phrases work best.
    gdelt_keywords:
      - communal claim fact check
      - old video viral claim
      - unrelated video shared
      - communal misinformation india
    hashtags: [factcheck, fakenews, misinformation, communalharmony, oldvideo]
    youtube_queries:
      - communal claim fact check india
      - old video viral false claim india
      - "सांप्रदायिक अफवाह फैक्ट चेक"

  - id: electoral_integrity
    label: Electoral process, voter-roll and EVM claims
    keywords:
      - voter roll
      - electoral roll
      - voter list deletion
      - EVM
      - electronic voting machine
      - booth capturing
      - Election Commission
      - vote fraud
      - "वोट चोरी"
      - "मतदाता सूची"
      - "ईवीएम"
      - "चुनाव आयोग"
    gdelt_keywords:
      - voter roll claim
      - electoral roll fraud claim
      - EVM tampering claim
      - election commission fact check
    hashtags: [evm, voterlist, electioncommission, votechori, electionfactcheck]
    youtube_queries:
      - EVM tampering claim fact check
      - voter list deletion claim india
      - "वोट चोरी दावा फैक्ट चेक"

  - id: health_claims
    label: Health, medicine and public-health claims
    # Closest topic to the LIAR / CoAID / FakeNewsNet benchmarks the Phase 2
    # classifiers are trained on, so expect the *smallest* domain-transfer gap
    # here and the largest on communal_claims. That contrast is worth measuring
    # explicitly rather than reporting one pooled number.
    keywords:
      - vaccine
      - vaccination
      - cancer cure
      - home remedy
      - ayurvedic cure
      - immunity
      - outbreak
      - ICMR
      - "टीका"
      - "घरेलू नुस्खा"
      - "कैंसर का इलाज"
      - "स्वास्थ्य दावा"
    gdelt_keywords:
      - vaccine claim fact check
      - health misinformation india
      - cancer cure claim
      - home remedy false claim
    hashtags: [healthmisinformation, vaccine, factcheck, publichealth]
    youtube_queries:
      - health misinformation fact check india
      - cancer cure claim debunked
      - "स्वास्थ्य से जुड़ा फर्जी दावा"

  - id: scams_synthetic
    label: Financial scams, fake schemes and AI-generated media
    # The only topic where the *artefact* is the claim: a cloned voice or a
    # face-swapped endorsement is the misinformation, not a caption about it.
    # Phase 2's media module is out of scope for this project, so records here
    # carry the claim text only and the synthetic-media judgement is absent
    # rather than guessed.
    keywords:
      - deepfake
      - AI generated video
      - voice clone
      - fake investment
      - trading scam
      - government scheme
      - free money scheme
      - "डीपफेक"
      - "फर्जी योजना"
      - "निवेश घोटाला"
      - "एआई वीडियो"
    gdelt_keywords:
      - deepfake video claim
      - ai generated video india
      - fake investment scheme claim
      - government scheme false claim
    hashtags: [deepfake, aigenerated, scamalert, fakescheme, factcheck]
    youtube_queries:
      - deepfake endorsement scam india
      - fake government scheme claim fact check
      - "डीपफेक वीडियो फैक्ट चेक"

# Languages this case goes looking for.
#
# DECLARATIVE ONLY. Nothing reads this key -- it records intent so the EDA
# notebook and the model cards can state the scope in one place. The actual
# enforcement points are three, and they are deliberately separate because they
# gate different things:
#
#   configs/sources.yaml  gdelt.doc_api.languages   -> which GDELT articles are fetched
#   configs/sources.yaml  youtube.discovery.*       -> regionCode / relevanceLanguage
#   modeling/config.py    Settings.languages        -> which records get SCORED
#
# The third is still `("en",)`. Ingesting Hindi and scoring Hindi are separate
# decisions, and widening the scorer needs a multilingual checkpoint, not a
# config edit. Until that lands, Hindi records are collected and stored but
# skipped by the scoring pass with a reason code. That gap is intentional and
# is stated in the README rather than hidden behind a config default.
languages:
  - english
  - hindi

# Rolling window for time-scoped sources (GDELT, NewsAPI). Days.
lookback_days: 7
