# Per-module model choices, versions and thresholds.
#
# The `version` field of each module is what lands in every scored row's
# `model_versions` map. Bump it whenever the checkpoint, the label mapping or a
# decision threshold changes -- that is how Phase 4 detects a stale score.
#
# Nothing here is a hyperparameter sweep. One sensible config per model, tuned
# on the validation split, is the stated policy: evaluation rigour buys more
# than the third decimal place of F1.

defaults:
  batch_size: 32
  max_length: 256
  seed_offset: 0

# --- Module A: text / narrative --------------------------------------------
embed:
  version: v0.1.0
  # CPU-viable default. bge-base is better and needs a GPU for bulk embedding;
  # the dimension is read from the loaded model, never hardcoded, because
  # Phase 4's pgvector column width depends on it.
  model_name: sentence-transformers/all-MiniLM-L6-v2
  alternatives:
    - BAAI/bge-base-en-v1.5
  batch_size: 64
  max_seq_length: 256      # tokens; long articles are title + head, see embed.py
  normalize: true          # L2 -- cosine assumptions downstream depend on it

cluster:
  version: v0.1.0
  min_cluster_size: 15
  min_samples: 5
  cluster_selection_epsilon: 0.0
  cluster_selection_method: eom
  # Near-duplicate collapse before clustering, so one repost swarm cannot
  # become its own narrative and dominate every metric.
  simhash_hamming: 3
  # Cross-run identity: match new centroids to old above this cosine and carry
  # the narrative_id forward. Below it, mint a new id.
  stability_threshold: 0.85
  representatives_per_cluster: 5
  # severity = engagement-weighted mean of the member misinfo_prob scores in
  # the top quartile (an expected-shortfall statistic), NOT a mean and NOT a
  # percentile. Both of those fail on real narrative shape; the reasoning is
  # written out in NarrativeClusterer._severity.
  severity_percentile: 75          # the tail cut-off, not the reported value
  severity_engagement_weighted: true

misinfo:
  version: v0.1.0
  base_model: roberta-base
  fallback_model: distilbert-base-uncased
  num_labels: 2
  max_length: 256
  batch_size: 16
  learning_rate: 2.0e-5
  epochs: 3
  warmup_ratio: 0.1
  weight_decay: 0.01
  # LIAR's 6-way label collapsed to binary. half-true is DROPPED, not assigned:
  # forcing it to one side manufactures label noise the metrics cannot see.
  #
  # Every key and value is quoted. YAML 1.1 parses bare `true`/`false` as
  # booleans, so an unquoted `false: false` becomes the key `False` and stops
  # matching LIAR's string label -- which silently drops a sixth of the corpus
  # and looks like nothing at all went wrong.
  liar_label_map:
    "pants-fire": "false"
    "false": "false"
    "barely-true": "false"
    "half-true": "drop"
    "mostly-true": "true"
    "true": "true"
  calibration: isotonic
  decision_threshold: 0.5

stance:
  version: v0.2.0
  # An NLI+FEVER-tuned encoder, not a bare one. (claim, post) stance is
  # structurally premise/hypothesis entailment, so this checkpoint starts the
  # fine-tune already knowing the relation; roberta-base starts from nothing.
  # The same checkpoint is also run zero-shot as a baseline, which is how we
  # find out whether the fine-tune bought anything.
  base_model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
  fallback_model: microsoft/deberta-v3-base
  labels: [support, deny, discuss, unrelated]
  max_length: 256
  batch_size: 16
  learning_rate: 2.0e-5
  epochs: 3
  warmup_ratio: 0.1
  weight_decay: 0.01
  # Recompute activations in the backward pass instead of storing them.
  # Measured on an 8 GiB machine: DeBERTa-v3-base at batch 8 / seq 256 peaks at
  # 5.0 GiB with this on and OOMs without it. Costs ~30% throughput.
  gradient_checkpointing: true
  # Trained on FNC-1, whose four classes map one-to-one onto the contract.
  # Severely imbalanced -- unrelated 73%, disagree 1.7% -- so the loss is class
  # weighted and macro-F1 is the headline. Accuracy is banned from the report.
  #
  # NOT CALIBRATED, and deliberately so: modeling/eval/calibrate.py is binary,
  # stance is 4-class, and nothing in configs/fusion.yaml multiplies
  # `stance_conf`. An uncalibrated confidence that is documented as such is
  # honest; a calibrator bolted onto the wrong arity is not. Read `stance_conf`
  # the way the README's table says to read `toxicity`.
  calibration: none
  # Zero-shot NLI mapping, used for the baseline and when no checkpoint exists.
  # The NLI head has no `unrelated` class -- `unrelated` is a *retrieval*
  # judgement, not an entailment one -- so it is assigned by thresholding the
  # entailment/contradiction mass rather than predicted. That is a documented
  # approximation and the reason the zero-shot run is a baseline, not a model.
  zero_shot:
    enabled: true
    entailment_label: entailment
    contradiction_label: contradiction
    neutral_label: neutral
    unrelated_below: 0.40

summarize:
  version: v0.1.0
  # Pinned, and recorded in model_versions. temperature 0 for reproducibility.
  llm_model: claude-haiku-4-5-20251001
  temperature: 0.0
  max_tokens: 512
  max_retries: 2
  representatives: 5

# --- Module B: account / coordination --------------------------------------
bot:
  version: v0.1.0
  primary: xgboost
  comparison: random_forest
  xgboost:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
  random_forest:
    n_estimators: 500
    max_depth: 12
    min_samples_leaf: 2
  n_folds: 5
  calibration: isotonic
  # A false "bot" accusation is costlier than a miss in this product, so the
  # operating point is chosen from the PR curve at a precision target, never 0.5.
  precision_target: 0.85
  shap_top_k: 5

coordination:
  version: v0.1.0
  window_minutes: 60
  simhash_hamming: 3
  embedding_cosine: 0.95
  min_shared_urls: 1
  min_hashtag_sequence: 2
  # LSH bucketing: pairwise comparison is O(n^2) and the corpus will grow.
  lsh_bands: 8
  min_edge_weight: 0.15
  # Sources whose records carry real threading and stable author identity.
  # Kaggle-flat Reddit has parent_id=None honestly and is excluded.
  eligible_sources: [reddit, mastodon, youtube]
  evidence_weights:
    near_dup: 1.0
    cotweet: 0.8
    hashtag_seq: 0.5
    temporal: 0.3
  null_model_shuffles: 5

# --- Module C: media --------------------------------------------------------
deepfake:
  version: v0.2.0-pretrained
  # A pre-existing detector, used with NO fine-tuning.
  #
  # Why: FaceForensics++ is 17 GB behind a signed agreement, and the DFDC copy
  # on disk is pre-extracted crops whose `original` field was dropped, so a
  # fake cannot be tied to the real clip it came from. That bars *training* on
  # it (identity leakage: DFDC swaps faces between actors recorded in the same
  # sessions, so a model could memorise a face and be scored on that same face
  # from the other side of the split). It does not bar *testing* -- a set used
  # purely for testing has no internal boundary to leak across. See the long
  # note in modeling/datasets/dfdc.py.
  #
  # So the module's own stated role -- "a cross-dataset generalisation check
  # against a model trained on FaceForensics++" -- is satisfiable today by
  # mounting someone else's trained detector and scoring DFDC with it. Zero
  # training, and leakage-free by construction.
  #
  # A plain ViT, loadable with AutoModelForImageClassification and no
  # trust_remote_code.
  #
  # CHOSEN BY MEASUREMENT, not by download count. Both no-remote-code
  # candidates were scored on DFDC at video grain; only this one has signal:
  #
  #   dima806/deepfake_vs_real_image_detection        ROC-AUC 0.667
  #   prithivMLmods/Deep-Fake-Detector-v2-Model       ROC-AUC 0.512 [0.447, 0.584]
  #
  # The second one's interval straddles 0.5, i.e. no signal at all on DFDC's
  # face swaps -- its PR-AUC of 0.825 is just the 80% positive base rate, which
  # is exactly why PR-AUC must not be read without ROC-AUC on a set this
  # imbalanced. Numbers in artifacts/eval/deepfake/.
  #
  # The FF++-trained alternative below is the better domain match -- it is
  # trained on the face-swap manipulations this module actually targets, rather
  # than on AI-generated images -- but it ships custom_code, meaning weights
  # *and code* execute from the Hub at load time. That is a supply-chain
  # decision, so it is left to a human rather than defaulted on.
  hf_model: dima806/deepfake_vs_real_image_detection
  alternatives:
    # No signal on DFDC. Kept here as the record of a tested and rejected option.
    - prithivMLmods/Deep-Fake-Detector-v2-Model
    # Requires trust_remote_code=True. Read the note above first.
    - KoreaPeter/ms-eff-gcvit-deepfake-b0-ff-plus-plus
  # Kept for the FaceForensics++ training path, which is still the better model
  # if anyone obtains the data.
  backbone: xception41
  pretrained: true
  unfreeze_last_blocks: 1
  # 224 for the ViT above. The FrameExtractor resizes crops to this, so it must
  # match the mounted model or every face is scored at the wrong scale.
  image_size: 224
  frames_per_video: 16
  # mean of the top-k frame scores: more robust than a plain mean, because a
  # manipulation that only affects part of a clip is averaged away otherwise.
  aggregate_top_k: 5
  face_min_size: 64
  batch_size: 16
  learning_rate: 1.0e-4
  epochs: 5
  methods: [Deepfakes, Face2Face, FaceSwap, NeuralTextures]
  compression: c23
  # The raw softmax is unusable as a decision value here: the pretrained
  # detector calls almost every DFDC video manipulated at 0.5, which scores
  # exactly the majority-class baseline. So DFDC is split in half by video --
  # one half fits an isotonic calibrator and the operating point, the other is
  # reported. Same discipline as `bot`: a false "manipulated" is costlier than
  # a miss, so the point comes off the PR curve at a precision target, not 0.5.
  calibration: isotonic
  precision_target: 0.85

# --- Module D: auxiliary passes --------------------------------------------
# Pretrained and off-the-shelf on purpose. Fine-tuning these is not justified
# by any measured problem, and each fine-tune is a metric we would have to
# defend.
toxicity:
  version: v0.1.0
  model_name: unitary/toxic-bert
  batch_size: 32
  max_length: 256

sentiment:
  version: v0.1.0
  # Social-media domain, unlike the generic SST-trained models.
  model_name: cardiffnlp/twitter-roberta-base-sentiment-latest
  batch_size: 32
  max_length: 256

emotion:
  version: v0.1.0
  model_name: j-hartmann/emotion-english-distilroberta-base
  batch_size: 32
  max_length: 256
  # The model emits 7 labels; the product wants 7 buckets. "disgust" is present
  # in this model, so no bucket is synthesized. Any unmapped bucket is emitted
  # as 0.0 and the gap is documented rather than papered over.
  label_map:
    fear: fear
    anger: anger
    disgust: disgust
    joy: joy
    surprise: surprise
    sadness: sadness
    neutral: neutral

anomaly:
  version: v0.1.0
  method: isolation_forest
  n_estimators: 200
  contamination: 0.05
  # Unsupervised. Reported as a score distribution plus a hand-audit of the top
  # 20, never as an F1 against labels that do not exist.
