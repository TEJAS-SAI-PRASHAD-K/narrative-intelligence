name: CI

# The repository had no CI, and that is partly how two defects survived:
#
#   * `selectolax` 1.0 removed the parser backend `ingest/normalize.py`
#     imported, and both call sites swallowed the ImportError, so HTML parsing
#     silently became regex parsing.
#   * `.gitignore` carried an unanchored `models/`, which also matched
#     `app/models/`, so the 27-table ORM package was never committed.
#
# Neither needed a clever test to catch. They needed any test, run anywhere
# other than the laptop that already had the right files on disk.

on:
  push:
    branches: [main]
  pull_request:

# A force-push should not leave three stale runs burning minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The suite patches socket.connect to raise, so a test reaching the network
  # fails loudly rather than passing slowly. This keeps the adapters honest too.
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "ruff>=0.4"
      # Mirrors `make lint` exactly. `ruff format` is NOT gated: it has never
      # been run on this codebase and would reformat 34 files, which is a
      # separate decision deserving its own reviewable diff.
      - run: ruff check ingest modeling tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject requires >=3.11. Both are tested because the ingestion
        # layer is pure-Python and cheap to verify twice, and because a version
        # floor nobody exercises is a floor nobody can rely on.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # The `sources` extra is NOT installed wholesale. It pulls convokit and
        # kaggle, both heavy and fussy, and no test needs them -- every adapter
        # declares `requires_package` and skips cleanly when its library is
        # absent. The four source libraries that tests DO exercise are named
        # individually, so a convokit dependency conflict cannot turn this job
        # red for a reason unrelated to the change under review.
        run: |
          python -m pip install -e ".[modeling,api,dev]"
          python -m pip install \
            "trafilatura>=1.9" \
            "gdeltdoc>=1.5" \
            "google-api-python-client>=2.130" \
            "Mastodon.py>=1.8"

      - name: Test
        # No ignores. `app/models/` landed in 26d3ef0, so the 28 contract tests
        # run and the whole suite is collectable for the first time in CI.
        env:
          DEMO_MODE: "1"
          ENVIRONMENT: ci
        run: python -m pytest

  # Catches API contract drift without a database: openapi.json is committed and
  # must match what the code produces. Runs even though the contract tests
  # cannot, because `app/main.py` imports `app.models` lazily inside its startup
  # handler -- so the module imports fine and only booting fails.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[api]"
      - name: openapi.json matches the code
        run: python -m app.openapi_export --check openapi.json

  # The 27 tests that skip without a database: ETL, migrations, auth and the
  # router integration tests. They are the only ones that touch real SQL, so
  # without this job the 27-table schema is asserted by nothing -- the contract
  # tests run against DEMO_MODE fixtures and never open a connection.
  #
  # Mirrors `make test-api`, which does the same thing with `docker run`.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not plain postgres: app/models/embeddings.py declares a
        # vector column, so a stock image fails at CREATE EXTENSION.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: narrative
          POSTGRES_PASSWORD: test
          POSTGRES_DB: narrative_test
          TZ: UTC
        ports:
          - 5432:5432
        # Without this the job races the container and fails on connection
        # refused roughly one run in three.
        options: >-
          --health-cmd "pg_isready -U narrative"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[modeling,api,dev]"

      - name: Enable pgvector
        # The extension is created by a superuser once, not by the test
        # fixtures -- see the note in tests/conftest_api.py about `public`
        # having to stay on the search path.
        run: |
          PGPASSWORD=test psql -h 127.0.0.1 -U narrative -d narrative_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Postgres-backed tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://narrative:test@127.0.0.1:5432/narrative_test
        # -m postgres would miss them: the suite gates on a module-level
        # skipif over TEST_DATABASE_URL, not on the marker, so the files are
        # named directly. A test that silently skips here is worse than no job.
        run: |
          python -m pytest tests/test_etl.py tests/test_migrations.py \
            tests/test_auth.py tests/test_routers -p no:cacheprovider -rs

      - name: Migration chain round-trips
        # `alembic downgrade base && alembic upgrade head`. The strongest single
        # assertion available about the schema, and it needs a real database.
        env:
          DATABASE_URL: postgresql+psycopg://narrative:test@127.0.0.1:5432/narrative_test
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
