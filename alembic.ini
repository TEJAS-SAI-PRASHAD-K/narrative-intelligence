# Alembic configuration.
#
# sqlalchemy.url is deliberately EMPTY. The URL comes from DATABASE_URL through
# app/config.py in alembic/env.py, so there is exactly one source of truth and
# no credential can be committed here by accident.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Date-prefixed revision files sort chronologically in the directory listing,
# which makes reviewing a migration chain far easier than a wall of hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
sqlalchemy.url =

# No post_write_hooks: the console_scripts hook resolves `ruff` against
# alembic's own entrypoints rather than the venv's and fails when the two
# differ. `make fmt` formats alembic/ along with everything else.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
