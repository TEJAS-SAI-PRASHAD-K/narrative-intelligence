[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-intelligence"
version = "0.4.0"
description = "Narrative Intelligence Platform, phases 1-4: a reproducible schema-normalized multi-platform corpus, the models and scored tables built on it, and the async API that serves them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core dependencies. These are required for the schema, normalization, storage,
# CLI and test suite to work. Deliberately kept light so `pytest` runs anywhere.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "tenacity>=8.3",
    "tldextract>=5.1",
    "selectolax>=0.3.21",
    "langdetect>=1.0.9",
    "orjson>=3.10",
    "requests>=2.32",
    "feedparser>=6.0.11",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Phase 4 backend. Kept out of the core dependency set so `pytest` on the
# ingestion and modeling layers still runs on a light install, and so the API
# image can be built without the modeling tree.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "greenlet>=3.0",          # SQLAlchemy's async bridge; not a transitive dep
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",     # api key hashing; falls back to pbkdf2 if absent
    "httpx>=0.27",
]
# Report rendering. Split out because a CSV export needs none of it and the
# PDF/PPTX trees are heavy.
reports = [
    "reportlab>=4.2",
    "python-pptx>=0.6.23",
]
# Phase 2 modeling. Split out so `pytest` and the ingestion layer still run on a
# light install: the split/IO/feature tests import none of these.
modeling = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.45",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "torch>=2.2",
    "networkx>=3.3",
    "matplotlib>=3.8",
]
# Deepfake module. Heaviest tree in the project and needed by exactly one
# module, so it is opt-in; modeling/media/* imports it lazily and degrades with
# a clear message.
media = [
    "timm>=1.0",
    "opencv-python>=4.9",
    "pillow>=10.0",
]
# Narrative summarization. The pipeline completes without it (and without an
# API key) by falling back to centroid labels.
llm = [
    "anthropic>=0.34",
]
# Source adapters with heavy / fussy transitive dependency trees. Every adapter
# imports these lazily and degrades with a clear message when they are missing,
# so a partial install still runs the rest of the pipeline.
sources = [
    "convokit>=3.0",
    "Mastodon.py>=1.8",
    "gdeltdoc>=1.5",
    "trafilatura>=1.9",
    "google-api-python-client>=2.130",
    "kaggle>=1.6",
    "zstandard>=0.22",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
ingest = "ingest.cli:app"
modeling = "modeling.cli:app"
narrative-etl = "app.etl.cli:app"

[tool.setuptools.packages.find]
include = ["ingest*", "modeling*", "app*", "nlp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "auto"
markers = [
    "postgres: needs a live Postgres with pgvector (set TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # typer uses function calls in argument defaults
    "UP017",  # timezone.utc reads clearer than the UTC alias, and we say it a lot
    "UP042",  # str+Enum is deliberate: reason codes serialize as plain strings
]
