[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-intelligence"
version = "0.1.0"
description = "Phase 1 ingestion layer for the Narrative Intelligence Platform: a reproducible, schema-normalized multi-platform corpus."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core dependencies. These are required for the schema, normalization, storage,
# CLI and test suite to work. Deliberately kept light so `pytest` runs anywhere.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "tenacity>=8.3",
    "tldextract>=5.1",
    "selectolax>=0.3.21",
    "langdetect>=1.0.9",
    "orjson>=3.10",
    "requests>=2.32",
    "feedparser>=6.0.11",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Source adapters with heavy / fussy transitive dependency trees. Every adapter
# imports these lazily and degrades with a clear message when they are missing,
# so a partial install still runs the rest of the pipeline.
sources = [
    "convokit>=3.0",
    "Mastodon.py>=1.8",
    "gdeltdoc>=1.5",
    "trafilatura>=1.9",
    "google-api-python-client>=2.130",
    "kaggle>=1.6",
    "zstandard>=0.22",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
ingest = "ingest.cli:app"

[tool.setuptools.packages.find]
include = ["ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer uses function calls in argument defaults
